name: CI
on:
  push:
    branches:
    - main
    - renovate/*
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Drafts the release
      packages: write # Pushes the image
      id-token: write # Signs the attestation
      attestations: write # Stores it
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
      with:
        dotnet-version: '11.0.x'
    
    - name: Set variables
      id: variables
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          INFORMATIONAL_VERSION=$VERSION
        else
          VERSION=$(gh release list --json isLatest,tagName --jq '.[] | select(.isLatest)|.tagName')
          INFORMATIONAL_VERSION="$VERSION-edge-${GITHUB_SHA::8}"
        fi
        echo VERSION=$VERSION >> $GITHUB_OUTPUT
        echo ASSEMBLY_VERSION=${VERSION#v} >> $GITHUB_OUTPUT
        echo ASSEMBLY_INFORMATIONAL_VERSION=${INFORMATIONAL_VERSION#v} >> $GITHUB_OUTPUT
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Test project
      run: |
        dotnet test ./TeslaMateAgile.Tests/TeslaMateAgile.Tests.csproj
        
    - name: Build project
      run: |
        runtimes=(linux-x64 linux-arm64 linux-arm win-x64)
        for runtime in "${runtimes[@]}"; do
          echo "Building for runtime: $runtime"
          dotnet publish ./TeslaMateAgile/TeslaMateAgile.csproj \
            -p:Version=${{ steps.variables.outputs.ASSEMBLY_VERSION }} \
            -p:InformationalVersion=${{ steps.variables.outputs.ASSEMBLY_INFORMATIONAL_VERSION }} \
            --self-contained true \
            --runtime $runtime \
            --output ./output/TeslaMateAgile-$runtime
        done
        
    # Named as Docker names the architectures, for the Dockerfile's TARGETARCH. The image has the runtime already
    - name: Publish for the Docker image
      run: |
        for arch in amd64:linux-x64 arm64:linux-arm64 arm:linux-arm; do
          dotnet publish ./TeslaMateAgile/TeslaMateAgile.csproj \
            -p:Version=${{ steps.variables.outputs.ASSEMBLY_VERSION }} \
            -p:InformationalVersion=${{ steps.variables.outputs.ASSEMBLY_INFORMATIONAL_VERSION }} \
            -p:UseAppHost=false \
            --self-contained false \
            --runtime ${arch#*:} \
            --output ./image/${arch%:*}
        done

    - name: Let Docker run Arm
      run: docker run --rm --privileged tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64,arm

    # Docker's default builder can't make one image for several architectures
    - name: Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    # One at a time, as only one can be loaded to run. The pushes reuse the cache
    - name: Check the image runs
      run: |
        for platform in linux/amd64 linux/arm64 linux/arm/v7; do
          docker buildx build --platform "$platform" --file TeslaMateAgile/Dockerfile --load --tag teslamateagile-test image
          docker run --rm --platform "$platform" --entrypoint sh teslamateagile-test -c 'test -f TeslaMateAgile.dll && dotnet --list-runtimes'
        done

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: TeslaMateAgile-linux-x64
        path: ./output/TeslaMateAgile-linux-x64
    
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: TeslaMateAgile-linux-arm64
        path: ./output/TeslaMateAgile-linux-arm64
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: TeslaMateAgile-linux-arm
        path: ./output/TeslaMateAgile-linux-arm
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: TeslaMateAgile-win-x64
        path: ./output/TeslaMateAgile-win-x64
        
    - name: Docker tags
      id: tags
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          versions="$VERSION"
          if [[ $VERSION =~ "-" ]]; then
            echo "Pre-release version detected, not setting latest tag"
          else
            versions+=" latest"
          fi
        else
          versions="edge"
        fi
        echo "versions=$versions" >> $GITHUB_OUTPUT
      env:
        VERSION: ${{ steps.variables.outputs.VERSION }}

    - name: Push Docker images (Deprecated - Docker Hub)
      if: steps.tags.outcome == 'success'
      run: |
        echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin
        tags=()
        for ver in $VERSIONS; do tags+=(--tag "$DOCKER_USERNAME/teslamateagile:$ver"); done
        docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --file TeslaMateAgile/Dockerfile "${tags[@]}" \
          --build-arg legacy_image_warning=true \
          --label "org.opencontainers.image.version=$IMAGE_VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --provenance false --push image
      env:
        DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        VERSIONS: ${{ steps.tags.outputs.versions }}
        IMAGE_VERSION: ${{ steps.variables.outputs.ASSEMBLY_INFORMATIONAL_VERSION }}

    # GHCR lists Buildx's own provenance as an unknown/unknown platform, and the attestation below covers it anyway
    # (https://github.com/orgs/community/discussions/45969)
    - name: Push Docker images (GitHub Container Registry)
      id: push
      if: steps.tags.outcome == 'success'
      run: |
        image=ghcr.io/amyjeanes/teslamateagile
        echo "image=$image" >> $GITHUB_OUTPUT
        echo $GITHUB_TOKEN | docker login ghcr.io --username amyjeanes --password-stdin
        tags=()
        for ver in $VERSIONS; do tags+=(--tag "$image:$ver"); done
        docker buildx build --platform linux/amd64,linux/arm64,linux/arm/v7 --file TeslaMateAgile/Dockerfile "${tags[@]}" \
          --label "org.opencontainers.image.version=$IMAGE_VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --provenance false --metadata-file metadata.json --push image
        echo "digest=$(jq --raw-output '."containerimage.digest"' metadata.json)" >> $GITHUB_OUTPUT
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSIONS: ${{ steps.tags.outputs.versions }}
        IMAGE_VERSION: ${{ steps.variables.outputs.ASSEMBLY_INFORMATIONAL_VERSION }}

    - name: Attest
      if: steps.push.outcome == 'success'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-name: ${{ steps.push.outputs.image }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Zip project
      run: |
        cd ./output/TeslaMateAgile-linux-x64
        zip -r ../TeslaMateAgile-linux-x64.zip .
        cd ../TeslaMateAgile-linux-arm64
        zip -r ../TeslaMateAgile-linux-arm64.zip .
        cd ../TeslaMateAgile-linux-arm
        zip -r ../TeslaMateAgile-linux-arm.zip .
        cd ../TeslaMateAgile-win-x64
        zip -r ../TeslaMateAgile-win-x64.zip .
        cd ../../
      if: startsWith(github.ref, 'refs/tags/')
      
    - name: Create Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: false
        files: output/*.zip
      if: startsWith(github.ref, 'refs/tags/')
      
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Connect to Kubernetes
      uses: AmyJeanes/Abyss-Infrastructure/.github/actions/connect-k8s@76b675dda6e36effeac8a2eab66e96bef57aecef # main
      with:
        kubeconfig: "${{ secrets.KUBECONFIG }}"
        hostname: "${{ vars.KUBERNETES_API_HOSTNAME }}"
        serviceTokenId: ${{ vars.CLOUDFLARE_TUNNEL_SERVICE_TOKEN_ID }}
        serviceTokenSecret: ${{ secrets.CLOUDFLARE_TUNNEL_SERVICE_TOKEN_SECRET }}

    - run: echo "${{ secrets.ABYSS_VALUES_FILE }}" | base64 --decode > abyss.values.yaml
        
    - name: Install TeslaMateAgile
      run: |
        helm upgrade --install --wait --atomic \
          teslamateagile ./charts/teslamateagile \
          --namespace default \
          --values abyss.values.yaml \
          --set image.tag=edge \
          --set image.pullPolicy=Always

    - name: Disconnect from Kubernetes
      if: always()
      uses: AmyJeanes/Abyss-Infrastructure/.github/actions/disconnect-k8s@76b675dda6e36effeac8a2eab66e96bef57aecef # main
